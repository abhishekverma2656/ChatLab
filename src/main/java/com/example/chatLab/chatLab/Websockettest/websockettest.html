
<!DOCTYPE html>
<html>
<head>
    <title>ChatFlow WebSocket Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
</head>
<body>
<h2>ChatFlow WebSocket Test</h2>

<button onclick="connect()">Connect</button>
<button onclick="subscribe()">Subscribe</button>

<p>
    <label>Chat ID:</label>
    <input id="chatId" type="number" value="1" min="1">
</p>

<p>
    <label>Sender ID:</label>
    <input id="senderId" type="number" value="1" min="1">
</p>

<input id="message" value="Hello from ChatFlow team!">
<button onclick="sendMessage()">Send Message</button>

<h3>Logs / Received Messages</h3>
<pre id="output"></pre>

<script>
    let client;
    let currentSubscription;

    function log(message) {
        document.getElementById("output").textContent +=
            message + "\n";
    }

    function connect() {
        if (client?.active) {
            log("Client is already active.");
            return;
        }

        client = new StompJs.Client({
            brokerURL: "ws://localhost:8080/ws",
            reconnectDelay: 0,
            debug: (message) => log(message)
        });

        client.onConnect = () => {
            log("STOMP CONNECTED");
        };

        client.onStompError = (frame) => {
            log("STOMP ERROR: " +
                (frame.headers.message || "Unknown error"));
            log(frame.body || "");
        };

        client.onWebSocketError = (event) => {
            log("WebSocket error: " + (event?.message || ""));
        };

        client.onWebSocketClose = () => {
            log("WebSocket connection closed.");
        };

        client.activate();
    }

    function subscribe() {
        if (!client?.connected) {
            log("Connect first!");
            return;
        }

        const chatId = Number(
            document.getElementById("chatId").value
        );

        if (!Number.isInteger(chatId) || chatId < 1) {
            log("Enter a valid Chat ID.");
            return;
        }

        currentSubscription?.unsubscribe();

        const destination = "/topic/chat/" + chatId;

        currentSubscription = client.subscribe(
            destination,
            (message) => {
                log("MESSAGE RECEIVED on " + destination);

                try {
                    const data = JSON.parse(message.body);
                    log(JSON.stringify(data, null, 2));
                } catch {
                    log(message.body);
                }
            }
        );

        log("Subscribed to " + destination);
    }

    function sendMessage() {
        if (!client?.connected) {
            log("Connect first!");
            return;
        }

        const chatId = Number(
            document.getElementById("chatId").value
        );

        const senderId = Number(
            document.getElementById("senderId").value
        );

        const content =
            document.getElementById("message").value.trim();

        if (!Number.isInteger(chatId) || chatId < 1 ||
            !Number.isInteger(senderId) || senderId < 1) {
            log("Enter valid Chat ID and Sender ID.");
            return;
        }

        if (!content) {
            log("Message cannot be empty.");
            return;
        }

        const payload = {
            chatId: chatId,
            senderId: senderId,
            content: content,
            messageType: "TEXT"
        };

        client.publish({
            destination: "/app/chat.send",
            headers: {
                "content-type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        log("SEND REQUEST: " + JSON.stringify(payload));
    }
</script>
</body>
</html>
